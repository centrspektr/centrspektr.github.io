<script>/* Портал теперь живёт по адресу portal.html (промт штаба 25, 01.11.2026). Старый адрес irtysh.html ведёт туда со всем, что после ? и # (#pravka, ?vhod= и т.д.).

(function(){ var NEW='https://glebbelov85.gitverse.site/portal.html', ls, ss; try{ ls=localStorage; ss=sessionStorage; }catch(e){}
  function b64(s){ return btoa(unescape(encodeURIComponent(s))); } function unb64(s){ return decodeURIComponent(escape(atob(s))); }
  if(location.hostname==='centrspektr.github.io'){ var p={l:{},s:{}}, i, k;
    try{ for(i=0;i<ls.length;i++){ k=ls.key(i); if(/^irtysh_/.test(k)||k==='spectr_editor') p.l[k]=ls.getItem(k); } }catch(e){}
    try{ if(ss.getItem('spectr_sess')!=null) p.s.spectr_sess=ss.getItem('spectr_sess'); }catch(e){}
    var h=location.hash.replace(/^#/,''), x=''; try{ x=b64(JSON.stringify(p)); }catch(e){}
    location.replace(NEW+location.search+'#'+(x?'perenos='+encodeURIComponent(x):'')+(h?(x?'&':'')+'h='+encodeURIComponent(h):'')); return; }
  location.replace('portal.html'+location.search+location.hash); })();</script>
