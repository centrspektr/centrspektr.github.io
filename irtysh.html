<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Иртыш-портал</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Bad+Script&family=Roboto+Mono:wght@200;300&family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}
/* Портал "Иртыш": вход-вихрь -> космос с узлами (Спектр, дашборды, MAX, планеты идей); вход в узел = провал */
:root{
  --bg:#04050d; --fg:#f1f3ff; --dim:#a7acd2; --glass:rgba(14,18,40,.62); --line:rgba(170,180,255,.24);
  --display:'Unbounded','Arial Black',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cm{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,var(--fl,rgba(255,255,255,.85)) 40%,rgba(255,255,255,0) 78%);opacity:0;pointer-events:none;z-index:9}
/* "Матрица": строка над порталом (год, потом часы) и под ним (дата); тонкие светящиеся зелёные знаки, как на приборах */
.mxl{position:fixed;left:5%;right:5%;height:1.4em;font:200 clamp(17px,5vw,24px)/1.4 'Roboto Mono','Courier New',ui-monospace,monospace;color:#3dff8f;text-shadow:0 0 2px #00ff6a,0 0 8px rgba(0,255,106,.75),0 0 18px rgba(0,200,90,.4);white-space:nowrap;overflow:hidden;pointer-events:none;z-index:4;transition:opacity .6s}
.mxl b{display:inline-block;width:1ch;text-align:center;font-weight:200;opacity:0}
.mxl b.h{color:#d8ffe6;text-shadow:0 0 10px #9dffbf}.mxl b.m{opacity:.7}
#mxA{top:31%}#mxB{top:65%}
/* "Иртыш-портал" внизу: чёрные буквы с белой обводкой, перо пишет то медленно, то быстрее */
#ttl{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:min(78vw,500px);transform:translateX(-50%);pointer-events:none;z-index:4;transition:opacity .6s}
#ttl svg{display:block;width:100%;height:auto;overflow:visible}
#ttl .tw{font-family:'Bad Script','Marck Script','Segoe Script',cursive;font-size:72px;fill:#05040c;stroke:#fff;stroke-width:1.15;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(255,255,255,.35))}
#mxR{position:fixed;left:0;top:0;width:100%;height:30%;pointer-events:none;z-index:3;transition:opacity 1.4s;filter:drop-shadow(0 0 3px rgba(0,255,106,.8));-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.co{background:none!important;border:0!important;padding:0!important;border-radius:0!important;overflow:visible}
.co svg{position:absolute;left:0;top:0;overflow:visible}
.co path{fill:none;stroke:var(--pc);stroke-width:1.4;filter:drop-shadow(0 0 4px var(--pc))}
.co span{position:absolute;top:0;left:24px;font:700 13px var(--body);color:#fff;text-shadow:0 0 10px var(--pc),0 0 2px #000;white-space:nowrap}
.co.big span{font-size:16px}.co.fl span{left:auto;right:24px}
.co .ms0{visibility:hidden;position:absolute}
@keyframes tw-write{to{stroke-dashoffset:0}}
@keyframes tw-fill{to{fill-opacity:1;opacity:1}}
#say{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));text-align:center;font:700 clamp(16px,4.6vw,22px) var(--body);letter-spacing:.04em;color:#e9e6ff;text-shadow:0 0 14px rgba(167,139,250,.8);opacity:0;transition:opacity 1.2s,transform 1.2s;transform:translateY(8px);pointer-events:none;z-index:4;padding:0 16px}
#say.on{opacity:1;transform:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--fg);font:700 15px var(--body);letter-spacing:.04em;z-index:4;transition:opacity .6s;padding:11px 22px;border-radius:99px;border:1px solid rgba(167,139,250,.55);background:rgba(20,16,48,.55);box-shadow:0 0 22px rgba(167,139,250,.35);cursor:pointer;white-space:nowrap}
#hint b{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
#vis{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:6;display:flex;align-items:center;gap:6px;font:700 13px var(--body);color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums}
#vis svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
#back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:700 20px var(--body);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#back.on{opacity:1;pointer-events:auto}
#topB{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:6;height:36px;padding:0 12px 0 8px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:700 12px var(--body);display:flex;align-items:center;gap:6px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#topB svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#topB.on{opacity:1;pointer-events:auto} #topB[aria-pressed=true]{border-color:rgba(167,139,250,.8);box-shadow:0 0 16px rgba(167,139,250,.5)}
.turn{position:fixed;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:700 26px var(--body);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#tL{left:max(10px,env(safe-area-inset-left,0px))} #tR{right:max(10px,env(safe-area-inset-right,0px))} .turn.on{opacity:.75;pointer-events:auto}
/* перелёты только кнопками: внизу "‹ предыдущая" и "следующая ›", палец только крутит камеру */
#nav{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .4s}
#nav.on{opacity:1;pointer-events:auto}
.nb{height:46px;min-width:0;max-width:48%;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:700 14px var(--body);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb[hidden]{display:none}
#nNext{border-color:rgba(167,139,250,.7);box-shadow:0 0 18px rgba(167,139,250,.35)}
#warp{position:fixed;inset:0;z-index:8;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--wc,#7cf3ff) 55%,#fff) 0%,var(--wc,#7cf3ff) 30%,#05030f 85%)}
#warp.on{opacity:1}
#warp b{font:700 clamp(26px,8vw,48px) var(--display);color:#fff;text-shadow:0 0 30px var(--wc,#7cf3ff);transform:scale(.9);transition:transform 1.1s}
#warp.on b{transform:scale(1.06)}
#snd{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:6;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--dim);cursor:pointer;display:grid;place-items:center;padding:0}
#snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#snd .w{opacity:.25}#snd.on{color:#fff;border-color:rgba(167,139,250,.7)}#snd.on .w{opacity:1}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:700 13px var(--body);color:#fff;padding:7px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--pc,var(--line));cursor:pointer;pointer-events:auto;transition:opacity .35s;will-change:transform}
.lb.big{font-size:15px;padding:9px 16px}
.lb.idea{border-style:dashed;color:#d6d3ff}
#cap{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));text-align:center;z-index:5;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;pointer-events:none;padding:0 16px}
#cap.on{opacity:1;transform:none;pointer-events:auto}
#cap.hi{bottom:30%}
#cap .go{display:inline-block;margin-top:4px;padding:10px 26px;border-radius:99px;color:#fff;font:800 16px var(--body);letter-spacing:.06em;background:color-mix(in srgb,var(--pc,#ffd36e) 30%,transparent);border:1px solid var(--pc,#ffd36e);box-shadow:0 0 24px var(--pc,#ffd36e);cursor:pointer;animation:goglow 1.6s ease-in-out infinite}
@keyframes goglow{50%{box-shadow:0 0 42px var(--pc,#ffd36e),0 0 8px #fff inset}}
#cap h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,34px);margin:0 0 6px;text-shadow:0 0 22px var(--pc,#7cf3ff);cursor:pointer;text-wrap:balance}
#cap p{margin:0;color:var(--dim);font-size:14px}
#cap p b{color:var(--fg)}
/* атмосфера MAX: после провала космос сменяется небом над селом (сюда встанет фото села) */
#atm{--photo:url(selo.jpg);position:fixed;inset:0;z-index:7;opacity:0;pointer-events:none;transition:opacity .9s;overflow:hidden;
  background:var(--photo,none) center/cover no-repeat, linear-gradient(180deg,#0b2a4a 0%,#2b6d8f 38%,#f2b880 72%,#f7d9a8 100%)}
#atm.on{opacity:1;pointer-events:auto}
#atm::before{content:"";position:absolute;inset:0 -10% 0 0;background:radial-gradient(ellipse 70% 30% at 30% 30%,rgba(255,255,255,.35),transparent 70%),radial-gradient(ellipse 60% 22% at 75% 45%,rgba(255,255,255,.28),transparent 70%),linear-gradient(180deg,rgba(4,10,24,.45),rgba(4,10,24,.1) 50%,rgba(4,10,24,.55));animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(-6%)}}
.atin{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.atin h2{font-family:var(--display);font-size:clamp(22px,6vw,34px);margin:0;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.atin p{margin:-12px 0 0;color:#e6ecff;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.avs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 14px;width:min(520px,100%)}
.av{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#fff;font:700 12px var(--body);text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.7);animation:float 5s ease-in-out infinite}
.av i{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;font:800 20px var(--display);font-style:normal;background:var(--ac);border:2px solid rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 18px var(--ac)}
@keyframes float{50%{transform:translateY(-6px)}}
@media (max-width:380px){.avs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn{font:700 14px var(--body);color:var(--fg);background:rgba(10,14,32,.55);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:11px 16px;cursor:pointer}
.btn:focus-visible,#topB:focus-visible,.turn:focus-visible,.lb:focus-visible,#back:focus-visible,#snd:focus-visible,#hint:focus-visible{outline:2px solid #7cf3ff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#hint b,.av,#atm::before{animation:none}}
</style>
